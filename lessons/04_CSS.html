<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta data ---------------------------------------------------- -->
    <meta charset="utf-8">            <!-- Character encoding (UTF‑8) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                                <!-- Makes the page responsive on mobile devices -->

    <style>
        p {
            background-color: #FFFFFF;
            font-size: 16px;
        }

        h1 {
            color: red;
        }

        .highlight {
            background-color: #FFF9C6;
            font-weight: bold;
        }

        /*ID-selector*/
        #main-notice {
            border: 2px solid #7B1FA2;
        }

    </style>

    <!-- Page title --------------------------------------------------- -->
    <title>Your Title Here</title>

    <!-- External CSS – put your own stylesheet(s) here if needed -->
    <!-- <link rel="stylesheet" href="styles.css"> -->
</head>

<body>
    <!-- Your content starts here ------------------------------------- -->
    <h1 id="main-notice">H1 with id main-notice</h1>
    <h1>Standard h1</h1>

    <p>This is the simplest HTML document you can use as a foundation.</p>

    <!-- Optional: External JavaScript – put your own .js file(s) here -->
    <!-- <script src="app.js"></script> -->
    <!-- Class, then id, then inline as a last resort -->

</body>
</html>
